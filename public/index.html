<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Practice Sheet Generator</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="./bundle.js" defer></script>
</head>
<body>
    <div class="wrapper">
        <header>
            <img src="img/logo.svg" alt="Daily Practice Sheet Logo" id="logo" width="64" height="64">
            <h1>Daily Practice Sheet</h1>
            <hr>
            <h2>A generator for worksheet printables</h2>
        </header>
        <main>
            <section id="intro-section">
                <p>Select up to six topics below. Choose how many half-pages to print. Each half-page mixes the selected topics across its quadrants.</p>
                <!--img src="img/kana-stroke-order.jpg"-->
            </section>
            <section id="topic-grid" data-view="normal"></section>
        </main>
        <footer>spratth c 2026 &middot; Animal illustrations from <a href="https://www.abbythepup.com">abbythepup.com</a> (CC0)</footer>
    </div>
</body>
</html>

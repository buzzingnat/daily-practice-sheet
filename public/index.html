<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Practice Sheet Generator</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="./bundle.js" defer></script>
</head>
<body>
    <div class="wrapper">
        <header>
            <img src="img/logo.svg" alt="Daily Practice Sheet Logo" id="logo" width="64" height="64">
            <h1>Daily Practice Sheet</h1>
            <hr>
            <h2>A generator for worksheet printables</h2>
        </header>
        <main>
            <section id="intro-section">
                <p>Select up to six topics below. Generate a set of half page printouts including each topic once per day.</p>
                <!--img src="img/kana-stroke-order.jpg"-->
                <div id="topic-choices"></div>
            </section>
            <section id="example-section">
                <h2>Example Exercises</h2>
                <div id="example-exercises"></div>
            </section>
        </main>
        <footer>spratth c 2026</footer>
    </div>
</body>
</html>
